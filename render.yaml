services:
  - type: web
    name: edutrack-platform
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: SUPABASE_URL
        value: "YOUR_SUPABASE_URL"
      - key: SUPABASE_KEY
        value: "YOUR_SUPABASE_KEY"
      - key: GROQ_API_KEY
        value: "YOUR_GROQ_API_KEY"
